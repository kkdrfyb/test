[package]
name = "jiandu-library"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "jiandu_library"
path = "src/lib.rs"

[[bin]]
name = "scan"
path = "src/bin/scan.rs"

[[bin]]
name = "jiandu"
path = "src/main.rs"
required-features = ["desktop"]

# 默认只编译纯书库库（cargo test 秒级）；桌面窗口需要显式 --features desktop。
[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]
# 独立窗口：启用后 generate_context! 会把 ../dist 内嵌为 tauri://localhost 资源，
# 窗口不再依赖 devUrl 的本地开发服务器；打包成 exe 时必须带这个 feature。
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tauri = { version = "2.12.5", optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
